# Single source of truth for tool versions: used locally, in the devcontainer and in CI (jdx/mise-action).
# Policy (ADR-0001): pin exact versions that are at least 7 days old. Renovate proposes bumps after that cooldown.
# Python itself is managed by uv from .python-version.

[tools]
uv = "0.13.4"
just = "1.59.0"
opentofu = "1.13.2"
tflint = "0.64.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.31.1"
gitleaks = "8.30.1"
node = "24.22.1"
"npm:markdownlint-cli2" = "0.24.0"
