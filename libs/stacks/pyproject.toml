[project]
name = "stacks"
version = "0.1.0"
description = "Stack catalog and CI plan/apply matrix for the gcp-agent-factory OpenTofu stacks."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "lark>=1.2",
    "python-hcl2>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
stacks = "stacks.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
