[project]
name = "repo-checks"
version = "0.1.0"
description = "Machine checks for gcp-agent-factory repository conventions (skills, ADRs, traceability, pragmas, pins)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pyyaml>=6.0", "stacks"]

[project.scripts]
repo-checks = "repo_checks.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
